<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/util.js" defer></script>
    <script src="../js/cadEntrega.js" defer></script>
    <title>Sistema de Logística</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;&emsp;
            <br><hr><br>
        </nav>
    </header>
    <main>
        <h1>Cadastrar Entrega</h1>
        <form>
            <label for="idCarga">Código da Carga:</label><br>
            <input type="text" id="idCarga" required><br><br>

            <label for="cidadeDestino">Cidade Destino:</label><br>
            <input type="text" id="cidadeDestino" required><br><br>

            <label for="status">Status:</label><br>
            <select id="status" required>
                <option value="TRANSITO">TRANSITO</option>
                <option value="ENTREGUE">ENTREGUE</option>
            </select><br><br>

            <label for="data">Data:</label><br>
            <input type="date" id="data" required><br><br>

            <label for="hora">Hora:</label><br>
            <input type="time" id="hora" required><br><br>

            <button id="btn_cadastrar">Cadastrar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
