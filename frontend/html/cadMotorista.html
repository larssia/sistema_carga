<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/util.js" defer></script>
    <script src="../js/cadMotorista.js" defer></script>
    <title>Sistema de Logística</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;&emsp;
            <br><hr><br>
        </nav>
    </header>
    <main>
        <h1>Cadastrar Motorista</h1>
        <form>
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" required><br><br>

            <label for="cnh">CNH:</label><br>
            <input type="text" id="cnh" required><br><br>

            <label for="cpf">CPF:</label><br>
            <input type="text" id="cpf" required><br><br>

            <label for="telefone">Telefone:</label><br>
            <input type="text" id="telefone" required><br><br>

            <button id="btn_cadastrar">Cadastrar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
