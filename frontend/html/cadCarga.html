<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/util.js" defer></script>
    <script src="../js/cadCarga.js" defer></script>
    <title>Sistema de Logística</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;&emsp;
            <br><hr><br>
        </nav>
    </header>
    <main>
        <h1>Cadastrar Carga</h1>
        <form>
            <label for="descricao">Descrição:</label><br>
            <input type="text" id="descricao" required><br><br>

            <label for="peso">Peso (kg):</label><br>
            <input type="number" id="peso" required step="0.01" min="0.01"><br><br>

            <label for="volume">Volume (m³):</label><br>
            <input type="number" id="volume" required step="0.01" min="0.01"><br><br>

            <label for="codRastreio">Código de Rastreio (numérico):</label><br>
            <input type="number" id="codRastreio" required min="1"><br><br>

            <label for="idMotorista">Código do Motorista:</label><br>
            <input type="text" id="idMotorista" required><br><br>

            <button id="btn_cadastrar">Cadastrar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
