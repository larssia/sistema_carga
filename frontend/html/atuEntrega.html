<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/util.js" defer></script>
    <script src="../js/atuEntrega.js" defer></script>
    <title>Sistema de Logística</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;&emsp;
            <br><hr><br>
        </nav>
    </header>
    <main>
        <h1>Atualizar Entrega</h1>
        <form>
            <label for="codEntrega">Código da Entrega:</label><br>
            <input type="text" id="codEntrega" required><br><br>

            <label for="idCarga">Código da Carga:</label><br>
            <input type="text" id="idCarga"><br><br>

            <label for="cidadeDestino">Cidade Destino:</label><br>
            <input type="text" id="cidadeDestino"><br><br>

            <label for="status">Status:</label><br>
            <select id="status">
                <option value=""></option>
                <option value="TRANSITO">TRANSITO</option>
                <option value="ENTREGUE">ENTREGUE</option>
            </select><br><br>

            <label for="data">Data:</label><br>
            <input type="date" id="data"><br><br>

            <label for="hora">Hora:</label><br>
            <input type="time" id="hora"><br><br>

            <button id="btn_atualizar">Atualizar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
